name: PR title

# Enforces docs/konwencja-commitow-i-pr.md §2/§4: the PR title must be a valid
# Conventional Commit, because this repo squash-merges — the title becomes the
# commit message on main. Runs on title edits too, not just push, since the
# title can change without new commits.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-title:
    name: Lint PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            perf
            chore
            ci
            style
            revert
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The subject must start with a lowercase letter and use imperative mood,
            e.g. "fix(logger): restore focus after set deletion".
            See docs/konwencja-commitow-i-pr.md.
